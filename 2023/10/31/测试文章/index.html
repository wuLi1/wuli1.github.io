<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>灵光 · 易经白话签</title>
    <style>
        :root {
            --bg-color: #FDFBF7;
            --card-bg: #FFFFFF;
            --primary-red: #A8463E;
            --text-main: #2C2C2C;
            --text-sub: #888888;
            --tag-work-bg: #FDEDED; --tag-work-text: #D93636;
            --tag-love-bg: #FDF0E6; --tag-love-text: #D46B08;
            --tag-life-bg: #F0F5FF; --tag-life-text: #1890FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center; /* 电脑端水平居中 */
        }

        /* 全局容器：限制最大宽度，模拟手机体验 */
        .app-container {
            width: 100%;
            max-width: 480px; /* 核心：限制最大宽度 */
            min-height: 100vh;
            background-color: var(--bg-color);
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.05); /* 电脑端两侧阴影 */
            display: flex;
            flex-direction: column;
        }

        /* --- 页面切换逻辑 --- */
        .page {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }
        
        .page.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ==================== 首页样式 ==================== */
        .home-header {
            margin-top: 60px;
            text-align: center;
            margin-bottom: 60px;
            flex-shrink: 0;
        }

        .home-title {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .home-title .icon {
            background: var(--primary-red);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .home-desc {
            color: var(--text-sub);
            font-size: 15px;
            line-height: 1.6;
        }

        /* 大圆按钮 */
        .draw-circle-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: linear-gradient(145deg, #B8554A, #903A32);
            box-shadow: 0 10px 30px rgba(168, 70, 62, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        /* 电脑端 Hover 效果 */
        @media (hover: hover) {
            .draw-circle-btn:hover {
                transform: translateY(-5px);
                box-shadow: 0 15px 40px rgba(168, 70, 62, 0.4);
            }
            .nav-item:hover, .btn:hover { opacity: 0.8; }
        }

        .draw-circle-btn:active { transform: scale(0.95); }

        .draw-circle-btn .gua-icon {
            font-size: 60px;
            line-height: 1;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .draw-circle-btn span {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .home-footer {
            margin-top: auto;
            text-align: center;
            color: #CCC;
            font-size: 12px;
            padding-bottom: 20px;
            line-height: 1.6;
            width: 100%;
        }

        /* ==================== 结果页样式 ==================== */
        .result-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 20px;
            color: var(--text-sub);
            font-size: 14px;
            flex-shrink: 0;
        }

        .nav-item { cursor: pointer; display: flex; align-items: center; gap: 5px; transition: opacity 0.2s; }

        /* 顶部运势条 */
        .fortune-bar {
            background: #E8ECEF;
            color: #4A5568;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            width: 100%;
            flex-shrink: 0;
        }

        /* 核心卡片 - 自适应高度 */
        .result-card {
            background: var(--card-bg);
            width: 100%;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.04);
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-gua-symbol {
            font-size: 70px;
            color: var(--primary-red);
            line-height: 1;
            margin-right: 20px;
            letter-spacing: -8px;
        }

        .card-info h2 {
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-level-tag {
            font-size: 12px;
            background: #F0F0F0;
            color: #666;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: normal;
        }

        .card-subtitle {
            font-size: 13px;
            color: #999;
        }

        .divider { height: 1px; background: #F5F5F5; margin: 20px 0; }

        .hint-section { margin-bottom: 25px; }
        .hint-label { font-size: 13px; color: #999; margin-bottom: 8px; }
        .hint-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; color: var(--text-main); }
        .hint-desc { font-size: 15px; color: var(--text-sub); line-height: 1.6; }

        .advice-list { display: flex; flex-direction: column; gap: 12px; }
        .advice-item {
            background: #FAFAFA;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            transition: transform 0.2s;
        }
        
        @media (hover: hover) {
            .advice-item:hover { transform: translateX(5px); background: #F5F5F5; }
        }

        .scene-tag {
            font-size: 13px; padding: 4px 10px; border-radius: 8px; margin-right: 12px; white-space: nowrap; font-weight: 600;
        }
        .tag-work { background: var(--tag-work-bg); color: var(--tag-work-text); }
        .tag-love { background: var(--tag-love-bg); color: var(--tag-love-text); }
        .tag-life { background: var(--tag-life-bg); color: var(--tag-life-text); }
        .advice-text { font-size: 15px; color: #444; line-height: 1.5; padding-top: 2px; }

        /* 底部按钮 */
        .bottom-actions {
            margin-top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }
        .btn-share { background: #FFF4E5; color: #8B4513; }
        .btn-retry { background: #2C2C2C; color: white; }

        /* 动画 */
        .shaking { animation: shake 0.5s ease-in-out infinite; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            75% { transform: translateX(5px) rotate(2deg); }
        }
    </style>
</head>

    <!-- 全局容器 -->
    <div class="app-container">
        
        <!-- ==================== 首页 ==================== -->
        <div id="homePage" class="page active">

            <div class="home-footer">

            </div>
        </div>

        <!-- ==================== 结果页 ==================== -->
        <div id="resultPage" class="page">

            <div class="fortune-bar" id="fortuneBar">
                🌙 此卦平稳 · 蓄力待发 🌙

                <div class="divider"></div>

                <div class="hint-section">

                </div>

                <div class="advice-list">
                    <div class="advice-item">
                        <span class="scene-tag tag-work">工作</span>
                        <span class="advice-text" id="resWork">项目推进顺利，适合主动争取机会。</span>
                    </div>
                    <div class="advice-item">

                    </div>
                    <div class="advice-item">

                        <span class="advice-text" id="resLife">精力充沛，适合运动健身或开启新计划。</span>
                    </div>
                </div>
            </div>

            <div class="bottom-actions">
                <button class="btn btn-share" onclick="shareResult()">📤 分享给朋友</button>
                <button class="btn btn-retry" onclick="startDraw()">🔮 再摇一签</button>
            </div>
        </div>

    </div>

        // ==================== 核心交互逻辑 ====================
        
        // 1. 抽签逻辑
        function startDraw() {
            const btn = document.getElementById('homeDrawBtn');
            
            // 添加摇晃动画
            btn.classList.add('shaking');
            
            // 随机获取一卦 (0 到 63)
            const randomIndex = Math.floor(Math.random() * yiJingData.length);
            const currentGua = yiJingData[randomIndex];
            
            // 模拟抽签延迟 0.8秒
            setTimeout(() => {
                btn.classList.remove('shaking');
                updateResultPage(currentGua);
                switchPage('resultPage');
            }, 800);
        }

        // 2. 更新结果页内容
        function updateResultPage(gua) {
            document.getElementById('fortuneBar').innerHTML = `🌙 ${gua.fortune} 🌙`;
            document.getElementById('resSymbol').textContent = gua.symbol;
            document.getElementById('resName').innerHTML = `${gua.name} <span class="card-level-tag">${gua.level}</span>`;
            document.getElementById('resIndex').textContent = `第 ${gua.id} 卦 · 六十四卦之一`;
            document.getElementById('resMain').textContent = gua.main;
            document.getElementById('resSub').textContent = gua.sub;
            document.getElementById('resWork').textContent = gua.work;
            document.getElementById('resLove').textContent = gua.love;
            document.getElementById('resLife').textContent = gua.life;
        }

        // 3. 页面切换
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0); // 切换页面时滚动到顶部
        }

        function goHome() { switchPage('homePage'); }

        // 4. 分享功能 (调用原生分享或复制链接)
        function shareResult() {
            const name = document.getElementById('resName').innerText;
            const main = document.getElementById('resMain').innerText;
            const text = `【灵光·白话签】我抽到了「${name}」：${main}。快来测测你的今日运势！`;
